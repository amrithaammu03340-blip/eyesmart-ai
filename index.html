<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EyeSmart AI - Intelligent Eye Screening</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#eef8ff,#f7f3ff);
color:#172033;
}

header{
background:linear-gradient(135deg,#1769aa,#6c4ab6);
color:white;
padding:22px 16px;
text-align:center;
}

header h1{margin:0;font-size:27px}
header p{margin:7px 0 0;font-size:14px}

.container{
max-width:950px;
margin:auto;
padding:18px;
}

.card{
background:white;
border-radius:18px;
padding:20px;
margin:15px 0;
box-shadow:0 7px 25px rgba(0,0,0,.08);
}

h2{color:#1769aa;margin-top:0}
h3{color:#51419b}

button{
border:0;
border-radius:10px;
padding:11px 16px;
margin:5px;
background:#1769aa;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{opacity:.9}

.secondary{background:#6c4ab6}
.success{background:#159957}
.warning{background:#e98b22}
.danger{background:#d64545}
.audio{background:#0b8f6a}

input,select,textarea{
width:100%;
padding:11px;
border:1px solid #ccd5e0;
border-radius:9px;
margin:6px 0 12px;
font-size:15px;
}

textarea{min-height:80px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:10px;
}

.lang-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
gap:8px;
}

.lang-grid button{
background:#f0f4ff;
color:#24345b;
border:1px solid #ccd8ff;
}

.lang-grid button.active{
background:#1769aa;
color:white;
}

.section{display:none}
.section.active{display:block}

.instruction{
background:#edf8ff;
border-left:5px solid #1769aa;
padding:13px;
border-radius:8px;
line-height:1.6;
}

.marker{
margin:15px auto;
max-width:500px;
padding:15px;
border:3px dashed #6c4ab6;
border-radius:14px;
text-align:center;
font-weight:bold;
background:#faf7ff;
}

.eye-result{
background:#f7f8fc;
padding:14px;
border-radius:12px;
margin:10px 0;
}

.va-line,
.near-line{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
padding:7px;
border-bottom:1px solid #e5e5e5;
}

.va-label,
.near-label{
width:55px;
font-size:14px;
font-weight:bold;
color:#6c4ab6;
}

.optotype{
font-family:Arial,sans-serif;
font-weight:900;
letter-spacing:4px;
line-height:1;
}

.plate-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:18px;
}

.plate-card{
background:#fafafa;
padding:15px;
border-radius:16px;
text-align:center;
border:1px solid #e1e5ef;
}

.ishihara{
width:190px;
height:190px;
border-radius:50%;
margin:10px auto 15px;
position:relative;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
box-shadow:inset 0 0 15px rgba(0,0,0,.15);
}

.dot{
position:absolute;
border-radius:50%;
}

.plate-number{
position:relative;
z-index:20;
font-size:58px;
font-weight:900;
font-family:Arial,sans-serif;
opacity:.75;
letter-spacing:1px;
text-shadow:0 1px 2px rgba(0,0,0,.1);
}

.answer{
text-align:center;
font-weight:bold;
}

.answer input{
text-align:center;
width:90%;
}

.symptom-card{
border:1px solid #e1e5ef;
border-radius:12px;
padding:12px;
margin:8px 0;
background:#fbfcff;
}

.symptom-title{
font-weight:bold;
margin-bottom:5px;
}

.symptom-controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.amsler{
width:min(88vw,430px);
aspect-ratio:1;
margin:20px auto;
position:relative;
background:
linear-gradient(#333 1px,transparent 1px),
linear-gradient(90deg,#333 1px,transparent 1px);
background-size:10% 10%;
border:2px solid #333;
}

.center-dot{
width:14px;
height:14px;
background:#e00000;
border-radius:50%;
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:10;
}

.check{
display:flex;
align-items:center;
gap:8px;
padding:5px;
}

.check input{
width:auto;
margin:0;
}

.report{
background:#f7fbff;
border:1px solid #d5e8f8;
padding:18px;
border-radius:12px;
}

.footer{
text-align:center;
font-size:12px;
color:#687386;
padding:25px;
}

.small{
font-size:13px;
color:#687386;
}

.disclaimer{
background:#fff7e8;
border-left:5px solid #e98b22;
padding:12px;
border-radius:8px;
font-size:13px;
}

.hidden{display:none!important}

@media(max-width:600px){

header h1{font-size:22px}

.container{padding:10px}

.card{padding:15px}

.ishihara{
width:170px;
height:170px;
}

.plate-number{
font-size:54px;
}

.symptom-controls{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header>
<h1>👁️ EyeSmart AI</h1>
<p id="headerSubtitle">AI-Assisted Preliminary Eye Screening System</p>
</header>

<div class="container">

<!-- HOME -->
<section id="home" class="section active">

<div class="card">

<h2 id="welcomeTitle"></h2>

<div class="instruction">
<b id="welcomeText"></b>
</div>

<h3 id="languageTitle"></h3>

<div class="lang-grid" id="languageButtons"></div>

<br>

<button class="audio" onclick="speakCurrent()">
🔊 <span id="listenText"></span>
</button>

<button onclick="showSection('patient')">
<span id="startText"></span> →
</button>

</div>

<div class="card disclaimer">
<b id="importantText"></b>
<span id="disclaimerText"></span>
</div>

</section>


<!-- PATIENT -->
<section id="patient" class="section">

<div class="card">

<h2 id="patientTitle"></h2>

<div class="grid">

<div>
<label id="nameLabel"></label>
<input id="pname">
</div>

<div>
<label id="ageLabel"></label>
<input id="page" type="number">
</div>

<div>
<label id="genderLabel"></label>
<select id="pgender">
<option id="maleOption"></option>
<option id="femaleOption"></option>
<option id="otherOption"></option>
</select>
</div>

<div>
<label id="phoneLabel"></label>
<input id="phone">
</div>

</div>

<button onclick="showSection('symptoms')">
<span id="nextPatient"></span> →
</button>

</div>
</section>


<!-- SYMPTOMS -->
<section id="symptoms" class="section">

<div class="card">

<h2 id="symptomTitle"></h2>

<p class="small" id="symptomHelp"></p>

<div id="symptomList"></div>

<button class="success" onclick="saveSymptoms()" id="saveSymptomsBtn"></button>

<button onclick="showSection('history')">
<span id="nextSymptoms"></span> →
</button>

</div>
</section>


<!-- HISTORY -->
<section id="history" class="section">

<div class="card">

<h2 id="historyTitle"></h2>

<label class="check">
<input type="checkbox" id="specs">
<span id="specsText"></span>
</label>

<label class="check">
<input type="checkbox" id="cl">
<span id="contactText"></span>
</label>

<label class="check">
<input type="checkbox" id="surgery">
<span id="surgeryText"></span>
</label>

<label id="historyDetailsLabel"></label>

<textarea id="historyDetails"></textarea>

<button onclick="showSection('distance')">
<span id="nextHistory"></span> →
</button>

</div>
</section>


<!-- DISTANCE -->
<section id="distance" class="section">

<div class="card">

<h2 id="distanceTitle"></h2>

<div class="instruction" id="distanceInstruction"></div>

<button class="audio" onclick="speakDistance()">
🔊 <span id="distanceAudio"></span>
</button>

<div class="marker" id="distanceMarker"></div>

<p class="small" id="calibrationNote"></p>

<div id="distanceChart"></div>

<div class="eye-result">
<b id="rightDistanceLabel"></b>

<select id="rightDistance">
<option value="">--</option>
<option>6/60</option>
<option>6/36</option>
<option>6/24</option>
<option>6/18</option>
<option>6/12</option>
<option>6/9</option>
<option>6/6</option>
</select>
</div>

<div class="eye-result">
<b id="leftDistanceLabel"></b>

<select id="leftDistance">
<option value="">--</option>
<option>6/60</option>
<option>6/36</option>
<option>6/24</option>
<option>6/18</option>
<option>6/12</option>
<option>6/9</option>
<option>6/6</option>
</select>
</div>

<button onclick="showSection('near')" id="distanceNext"></button>

</div>
</section>


<!-- NEAR -->
<section id="near" class="section">

<div class="card">

<h2 id="nearTitle"></h2>

<div class="instruction" id="nearInstruction"></div>

<button class="audio" onclick="speakNear()">
🔊 <span id="nearAudio"></span>
</button>

<div class="marker" id="nearMarker"></div>

<div id="nearChart"></div>

<div class="eye-result">
<b id="rightNearLabel"></b>

<select id="rightNear">
<option value="">--</option>
<option>N36</option>
<option>N24</option>
<option>N18</option>
<option>N12</option>
<option>N10</option>
<option>N8</option>
<option>N6</option>
</select>
</div>

<div class="eye-result">
<b id="leftNearLabel"></b>

<select id="leftNear">
<option value="">--</option>
<option>N36</option>
<option>N24</option>
<option>N18</option>
<option>N12</option>
<option>N10</option>
<option>N8</option>
<option>N6</option>
</select>
</div>

<button onclick="showSection('colour')" id="nearNext"></button>

</div>
</section>


<!-- COLOUR -->
<section id="colour" class="section">

<div class="card">

<h2 id="colourTitle"></h2>

<div class="instruction" id="colourInstruction"></div>

<button class="audio" onclick="speakColour()">
🔊 <span id="colourAudio"></span>
</button>

<p class="small" id="colourNote"></p>

<div class="plate-grid" id="plates"></div>

<button class="success" onclick="checkColour()" id="checkColourBtn"></button>

<p id="colourScore"></p>

<button onclick="showSection('amsler')" id="colourNext"></button>

</div>
</section>


<!-- AMSLER -->
<section id="amsler" class="section">

<div class="card">

<h2 id="amslerTitle"></h2>

<div class="instruction" id="amslerInstruction"></div>

<button class="audio" onclick="speakAmsler()">
🔊 <span id="amslerAudio"></span>
</button>

<div class="amsler">
<div class="center-dot"></div>
</div>

<div class="grid">

<div>
<label id="amslerRightLabel"></label>

<select id="amslerR">
<option value="normal" id="normalOption"></option>
<option value="distortion" id="distortionOption"></option>
<option value="missing" id="missingOption"></option>
<option value="wavy" id="wavyOption"></option>
</select>
</div>

<div>
<label id="amslerLeftLabel"></label>

<select id="amslerL">
<option value="normal" id="normalOption2"></option>
<option value="distortion" id="distortionOption2"></option>
<option value="missing" id="missingOption2"></option>
<option value="wavy" id="wavyOption2"></option>
</select>
</div>

</div>

<textarea id="amslerComment"></textarea>

<button onclick="generateResult()" id="summaryBtn"></button>

</div>
</section>


<!-- RESULT -->
<section id="result" class="section">

<div class="card">

<h2 id="resultTitle"></h2>

<div id="resultBox" class="report"></div>

<div class="disclaimer">
<b id="screeningOnlyText"></b>
<span id="screeningDisclaimer"></span>
</div>

<button class="audio" onclick="speakResult()">
🔊 <span id="readSummary"></span>
</button>

<button onclick="showSection('report')" id="viewReport"></button>

</div>
</section>


<!-- REPORT -->
<section id="report" class="section">

<div class="card">

<h2 id="reportTitle"></h2>

<div id="reportBox" class="report"></div>

<button onclick="window.print()" id="printBtn"></button>

<button onclick="showSection('home')" id="newScreening"></button>

</div>
</section>

</div>

<div class="footer">
EyeSmart AI • AI-Assisted Preliminary Eye Screening System
</div>

function buildLanguageButtons(){

box.innerHTML="";

Object.keys(languages).forEach(key=>{

function translateUI(){

const lang=languages[currentLang];

Object.entries(UI_KEYS).forEach(([id,key])=>{

const el=document.getElementById(id);

if(!el)return;

if(id==="historyDetails" || id==="amslerComment"){

el.placeholder=lang[key];

}else{

el.innerHTML=lang[key];

}

});


document.getElementById("headerSubtitle").textContent=
"EyeSmart AI • "+lang.result;


/* Keep the VA values unchanged.
   Translate only interface labels. */

document.querySelectorAll(".lang-grid button")
.forEach((b,i)=>{

const keys=Object.keys(languages);

b.classList.toggle("active",keys[i]===currentLang);

});

}

/* =====================================================
AUDIO
===================================================== */

let voices=[];

function loadVoices(){

if("speechSynthesis" in window){
voices=speechSynthesis.getVoices() || [];
}

}

if("speechSynthesis" in window){

loadVoices();

speechSynthesis.onvoiceschanged=loadVoices;

}


function speak(text){

if(!("speechSynthesis" in window)){

alert("Audio is not supported. Please use Google Chrome.");

return;

}

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);

const locale=languages[currentLang].locale;

let voice=
voices.find(v=>v.lang.toLowerCase()===locale.toLowerCase())
||
voices.find(v=>v.lang.toLowerCase().startsWith(
locale.split("-")[0].toLowerCase()
));

if(voice)u.voice=voice;

u.lang=locale;
u.rate=.85;
u.pitch=1;
u.volume=1;

speechSynthesis.speak(u);

}


function speakCurrent(){

speak(
t("welcome")+". "+
t("welcomeText")+". "+
t("language")
);

}


function speakDistance(){

speak(t("distanceInstruction"));

}


function speakNear(){

}

}

function seededRandom(seed){

let x=Math.sin(seed)*10000;

return x-Math.floor(x);

}


function createDots(container,p){

/*
Different positions + sizes for every plate.
Numbers are NOT formed by dots.
*/

for(let i=0;i<42;i++){

const d=document.createElement("span");

d.className="dot";

const r1=seededRandom(p.seed*100+i);
const r2=seededRandom(p.seed*200+i);
const r3=seededRandom(p.seed*300+i);

const size=5+(r3*12);

d.style.width=size+"px";
d.style.height=size+"px";

d.style.left=(3+r1*92)+"%";
d.style.top=(3+r2*92)+"%";

d.style.background=
p.colors[i%p.colors.length];

d.style.opacity=.78;

container.appendChild(d);

}

}


function buildColourPlates(){

const box=document.getElementById("plates");

box.innerHTML="";

plates.forEach((p,i)=>{

const card=document.createElement("div");

card.className="plate-card";

const title=document.createElement("h3");

title.textContent=t("plate")+" "+(i+1);


const circle=document.createElement("div");

circle.className="ishihara";

circle.style.background=p.bg;

createDots(circle,p);


const number=document.createElement("div");

number.className="plate-number";

number.textContent=p.number;

circle.appendChild(number);


const ans=document.createElement("div");

ans.className="answer";

ans.innerHTML=`

<label>${t("enterNumber")}</label>

<input
id="plate${i}"
type="text"
inputmode="numeric"
placeholder="${t("enterNumber")}">

`;

card.appendChild(title);
card.appendChild(circle);
card.appendChild(ans);

box.appendChild(card);

});

}


function checkColour(){

let score=0;

plates.forEach((p,i)=>{

const value=document
.getElementById("plate"+i)
.value.trim();

if(value===p.number)score++;

});

document.getElementById("colourScore").innerHTML=

`<b>${t("colourResult")}:</b>
${score} / ${plates.length}`;

}

function generateResult(){

saveSymptoms();

const rd=document.getElementById("rightDistance").value;
const ld=document.getElementById("leftDistance").value;

const rn=document.getElementById("rightNear").value;
const ln=document.getElementById("leftNear").value;

const ar=document.getElementById("amslerR").value;
const al=document.getElementById("amslerL").value;

const flags=[];

if(rd && rd!=="6/6")
flags.push(
`${t("rightDistance")}: ${rd}`
);

if(ld && ld!=="6/6")
flags.push(
`${t("leftDistance")}: ${ld}`
);

if(rn && rn!=="N6")
flags.push(
`${t("rightNear")}: ${rn}`
);

if(ln && ln!=="N6")
flags.push(
`${t("leftNear")}: ${ln}`
);

if(savedSymptoms.length)
flags.push(
`${t("symptoms")}: ${savedSymptoms.length}`
);

if(ar!=="normal")
flags.push(
`${t("right")}: ${t(ar)}`
);

if(al!=="normal")
flags.push(
`${t("left")}: ${t(al)}`
);


let html="";

html+=`

<p>
<b>${t("name")}:</b>
${document.getElementById("pname").value || t("notEntered")}
</p>

<p>
<b>${t("distance")}:</b>
${t("right")} ${rd||t("notRecorded")}
|
${t("left")} ${ld||t("notRecorded")}
</p>

<p>
<b>${t("near")}:</b>
${t("right")} ${rn||t("notRecorded")}
|
${t("left")} ${ln||t("notRecorded")}
</p>

<p>
<b>${t("symptoms")}:</b>
${
savedSymptoms.length
?savedSymptoms.map(x=>
`${x.name} (${x.eye}, ${x.since})`
).join(", ")
:t("noSymptoms")
}
</p>

<p>
<b>${t("amsler")}:</b>
${t("right")} – ${t(ar)}
;
${t("left")} – ${t(al)}
</p>

`;


if(flags.length){

html+=`<h3>${t("screeningOnly")}</h3><ul>`;

flags.forEach(f=>{
html+=`<li>${f}</li>`;
});

html+=`</ul>`;

html+=`

<p>
<b>
${t("summary")}:
</b>
${t("screeningDisclaimer")}
</p>

`;

}else{

html+=`

<h3>${t("summary")}</h3>

<p>
${t("noSymptoms")}.
${t("screeningDisclaimer")}
</p>

`;

}


document.getElementById("resultBox").innerHTML=html;

buildReport();

showSection("result");

}
